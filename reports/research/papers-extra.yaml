- id: prime-agent-paper
  kind: paper
  name: 'Prime Agent: A Self-Improving RLM Harness'
  alias: Prime Agent
  repo_url: https://arxiv.org/abs/2608.23552
  arxiv_id: '2608.23552'
  category: Papers / Harness
  improvement_target: Harness
  scope: experience-learning
  published_at: '2026-08-24'
  date_evidence_url: https://arxiv.org/abs/2608.23552
  venue: null
  publication_status: preprint
  venue_evidence_url: null
  code_url: https://github.com/PrimeIntellect-ai/prime-agent
  code_status: official
  code_evidence_url: https://arxiv.org/abs/2608.23552
  code_evidence_excerpt: Code is available at https://github.com/PrimeIntellect-ai/prime-agent.
  code_note_en: The author repository directly cites this paper and separately cites Continual Harness (2605.09998); neither citation should overwrite the other's title or first-paper date.
  code_note_zh: 作者仓库直接引用本文，并另引 Continual Harness（2605.09998）；两者标题与首版日期不应互相覆盖。
  summary_en: Combines a persistent REPL and recursive subagents with retained histories, memories, skills, prompts and subagent specifications that can be refined across long-horizon trajectories.
