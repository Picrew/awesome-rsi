research:
  title: Additional RSI Paper Research
  reviewed_at: '2026-09-08'
  record_count: 10
  purpose: Ten additional papers, separate from the 27-paper initial inventory and from active GitHub entries.
  evidence_policy: First-version dates and exact titles were read from canonical arXiv abstracts. Venues are populated only when an author-linked README explicitly states them. Null venue does not mean rejected or unpublished.
  code_policy: Official code linkage is supported by paper/project/author README; no recent push requirement. Partial or associated releases do not certify replication of every experiment.
  publication_status_policy: published denotes explicitly verified conference/workshop status; preprint denotes an available arXiv paper whose formal venue was not independently verified here, not a claim of no later publication.
  retrieval: web_fetch DNS failure followed by successful read-only urllib retrieval of arXiv abstracts/HTML and raw GitHub author READMEs. No delegates, catalog or script edits.
papers:
- id: ace
  kind: paper
  name: 'Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models'
  alias: ACE
  repo_url: https://arxiv.org/abs/2510.04618
  arxiv_id: '2510.04618'
  category: Papers / Artifacts
  improvement_target: Artifacts
  scope: experience-learning
  published_at: '2025-10-06'
  date_evidence_url: https://arxiv.org/abs/2510.04618
  venue: null
  publication_status: preprint
  venue_evidence_url: null
  code_url: https://github.com/ace-agent/ace
  code_status: official
  code_evidence_url: https://github.com/ace-agent/ace/blob/main/README.md
  code_evidence_excerpt: If you use ACE in your research, please cite our paper
  code_note_en: The author-linked repository documents Generator, Reflector and Curator roles, incremental delta updates, saved playbooks and evaluation modes; no weight training is implied.
  code_note_zh: 作者关联仓库记录生成者、反思者与整理者角色、增量更新、保存的 playbook 和评测模式；不涉及权重训练的暗示。
  summary_en: Treats context as a persistent evolving playbook; execution feedback is reflected into structured incremental updates that retain, refine and organize strategies across later tasks.
  summary_zh: 将上下文视为持久进化的 playbook，把执行反馈反思为结构化增量更新，以在后续任务中保留、修订和组织策略。
  limitation_en: Context adaptation is not model-weight learning; reported gains depend on task feedback and a fixed generation/reflection/curation architecture, with offline and online evaluation distinguished.
  limitation_zh: 上下文适配不等于模型权重学习；收益依赖任务反馈和固定的生成、反思、整理架构，离线与在线评测应区分。
  tags: [context-evolution, playbook, experience-learning]
  reviewed_at: '2026-09-08'
  evidence_url: https://arxiv.org/abs/2510.04618
  evidence_excerpt: contexts as evolving playbooks that accumulate, refine, and organize strategies through a modular process of generation, reflection, and curation
  why_included: Explicit retained context-update loop rather than generic memory storage; official implementation saves intermediate and best playbooks with helpful/harmful counters.
  rsi_mechanism:
    target: Structured context/playbook artifacts
    feedback: Execution results and reflected helpful/harmful evidence
    update: Generator trajectories produce reflections that the Curator merges as incremental deltas
    persistence: Saved playbooks and counters condition subsequent tasks and adaptation rounds
- id: seal
  kind: paper
  name: Self-Adapting Language Models
  alias: SEAL
  repo_url: https://arxiv.org/abs/2506.10943
  arxiv_id: '2506.10943'
  category: Papers / Models
  improvement_target: Models
  scope: self-training
  published_at: '2025-06-12'
  date_evidence_url: https://arxiv.org/abs/2506.10943
  venue: null
  publication_status: preprint
  venue_evidence_url: null
  code_url: https://github.com/Continual-Intelligence/SEAL
  code_status: official
  code_evidence_url: https://github.com/Continual-Intelligence/SEAL/blob/main/README.md
  code_evidence_excerpt: https://arxiv.org/abs/2506.10943
  code_note_en: The paper links its author project page, and the matching official repository links the same paper and page. The canonical repository is Continual-Intelligence/SEAL.
  code_note_zh: 论文链接作者项目页，匹配的官方仓库链接同一论文与项目页；规范仓库为 Continual-Intelligence/SEAL。
  summary_en: The model generates self-edits containing finetuning data or update directives; SFT makes persistent weight changes, and downstream performance trains better self-edit generation through an outer RL loop.
  summary_zh: 模型生成包含微调数据或更新指令的自编辑内容；SFT 产生持久权重变化，下游性能通过外层 RL 循环训练更好的自编辑生成能力。
  limitation_en: Self-edits control adaptation within a researcher-designed SFT/RL framework; experiments on knowledge incorporation and few-shot generalization do not prove unrestricted self-redesign.
  limitation_zh: 自编辑在研究者设计的 SFT/RL 框架内控制适配；知识吸收与少样本泛化实验不能证明无约束的自主重设计。
  tags: [self-adaptation, weight-updates, meta-learning]
  reviewed_at: '2026-09-08'
  evidence_url: https://arxiv.org/abs/2506.10943
  evidence_excerpt: these self-edits result in persistent weight updates, enabling lasting adaptation
  why_included: Strong model-level feedback loop in which the model's own generated adaptation instructions cause weight updates and are optimized using the adapted model's performance.
  rsi_mechanism:
    target: Model parameters and self-edit generation behavior
    feedback: Downstream performance of the model after applying its generated edit
    update: Generate adaptation data/directives, apply SFT, and reinforce edits with favorable downstream effects
    persistence: Adapted weights persist; the outer RL loop improves subsequent edit generation
- id: sica
  kind: paper
  name: A Self-Improving Coding Agent
  alias: SICA
  repo_url: https://arxiv.org/abs/2504.15228
  arxiv_id: '2504.15228'
  category: Papers / Harness
  improvement_target: Harness
  scope: self-modification
  published_at: '2025-04-21'
  date_evidence_url: https://arxiv.org/abs/2504.15228
  venue: ICLR 2025 Workshop on Scaling Self-Improving Foundation Models
  publication_status: published
  venue_type: workshop
  venue_evidence_url: https://github.com/MaximeRobeyns/self_improving_coding_agent/blob/master/README.md
  venue_evidence_excerpt: booktitle={ICLR 2025 Workshop on Scaling Self-Improving Foundation Models}
  official_venue_link: https://openreview.net/forum?id=rShJCyLsOr
  code_url: https://github.com/MaximeRobeyns/self_improving_coding_agent
  code_status: official
  code_evidence_url: https://arxiv.org/html/2504.15228v1
  code_evidence_excerpt: We make our code available at https://github.com/MaximeRobeyns/self_improving_coding_agent.
  code_note_en: The official repository uses the master branch; a main-branch README request returns 404. Its citation explicitly identifies a workshop, not the ICLR main conference track.
  code_note_zh: 官方仓库使用 master 分支，main 分支 README 请求返回 404；引用明确指向 workshop，而不是 ICLR 主会。
  summary_en: Evaluates the current coding agent, archives results, runs that same agent on its own codebase to implement an improvement, and evaluates the updated implementation again.
  summary_zh: 评测当前编码代理并归档结果，再让该代理修改自身代码实现改进，随后重新评测更新后的实现。
  limitation_en: Non-gradient scaffold learning uses fixed LLM weights; gains on a sampled SWE-bench Verified subset and other benchmarks do not establish unlimited progress or whole-benchmark state of the art.
  limitation_zh: 非梯度脚手架学习使用固定 LLM 权重；在抽样 SWE-bench Verified 子集等基准上的提升不代表无限进步或整个基准的最优表现。
  tags: [self-modification, coding-agent, workshop]
  reviewed_at: '2026-09-08'
  evidence_url: https://arxiv.org/abs/2504.15228
  evidence_excerpt: an agent system, equipped with basic coding tools, can autonomously edit itself, and thereby improve its performance on benchmark tasks
  why_included: The same agent solves coding tasks and edits its own full codebase; this is direct self-modification rather than a fixed external meta-agent only optimizing a target agent.
  rsi_mechanism:
    target: Coding-agent source implementation
    feedback: Benchmark results for each current agent version
    update: Run the agent against its own codebase and retain an updated version for evaluation
    persistence: Versioned agent code, archive results and improvement traces feed the next loop
- id: godel-agent
  kind: paper
  name: 'Gödel Agent: A Self-Referential Agent Framework for Recursive Self-Improvement'
  canonical_title_note: The arXiv citation meta tag spells the diacritic as TeX G\"odel; this record renders it as Gödel.
  alias: Gödel Agent
  repo_url: https://arxiv.org/abs/2410.04444
  arxiv_id: '2410.04444'
  category: Papers / Harness
  improvement_target: Harness
  scope: self-modification
  published_at: '2024-10-06'
  date_evidence_url: https://arxiv.org/abs/2410.04444
  venue: null
  publication_status: preprint
  venue_evidence_url: null
  code_url: https://github.com/Arvid-pku/Godel_Agent
  code_status: official
  code_evidence_url: https://arxiv.org/abs/2410.04444
  code_evidence_excerpt: https://github.com/Arvid-pku/Godel_Agent
  code_note_en: The canonical abstract links the repository, whose README links the same paper. No verified formal-proof implementation or conference venue is inferred from the name.
  code_note_zh: 规范摘要链接该仓库，仓库 README 回链同一论文；不依据名称推断形式证明实现或会议归属。
  summary_en: Uses LLM-generated changes to recursively revise the agent's own logic and behavior under high-level objectives rather than limiting changes to a predefined task-agent pipeline.
  summary_zh: 根据高层目标利用 LLM 生成修改，递归修订代理自身逻辑与行为，而非仅在预定义任务代理流水线中调整。
  limitation_en: Inspired by the Gödel machine but supported by empirical task evaluations, not proofs that all rewrites are beneficial or that the whole agent-design space is optimally searched.
  limitation_zh: 受 Gödel machine 启发，但依据的是实证任务评测，不是所有改写有益或整个代理设计空间得到最优搜索的证明。
  tags: [self-reference, self-modification, agent-design]
  reviewed_at: '2026-09-08'
  evidence_url: https://arxiv.org/abs/2410.04444
  evidence_excerpt: dynamically modify its own logic and behavior, guided solely by high-level objectives through prompting
  why_included: Explicitly targets editable agent logic and recursive self-revision; limitations prevent conflating the empirical framework with a provably optimal Gödel machine.
  rsi_mechanism:
    target: Agent logic and behavioral implementation
    feedback: Performance against high-level objectives on reasoning and agent tasks
    update: LLM-driven revisions of the agent's own logic and behavior
    persistence: Revised implementations participate in subsequent self-improvement attempts
- id: rest-mcts
  kind: paper
  name: 'ReST-MCTS*: LLM Self-Training via Process Reward Guided Tree Search'
  alias: ReST-MCTS*
  repo_url: https://arxiv.org/abs/2406.03816
  arxiv_id: '2406.03816'
  category: Papers / Models
  improvement_target: Models
  scope: self-training
  published_at: '2024-06-06'
  date_evidence_url: https://arxiv.org/abs/2406.03816
  venue: null
  publication_status: preprint
  venue_evidence_url: null
  code_url: https://github.com/THUDM/ReST-MCTS
  code_status: official
  code_evidence_url: https://arxiv.org/abs/2406.03816
  code_evidence_excerpt: We release all code at https://github.com/THUDM/ReST-MCTS.
  code_note_en: Official README documents policy/value-model synthetic-data generation and iterative training. Presence of code is not independent replication of every reported result.
  code_note_zh: 官方 README 记录策略和价值模型的合成数据生成与迭代训练；有代码不代表独立复现所有报告结果。
  summary_en: Uses process-reward-guided tree search to infer step values from correct final answers, then trains both the policy and process reward model on selected traces across multiple iterations.
  summary_zh: 用过程奖励引导的树搜索根据正确终局答案推断步骤价值，再在多轮迭代中利用所选轨迹训练策略模型和过程奖励模型。
  limitation_en: Removes per-step manual annotation, not oracle final-answer supervision; externally designed search and reward-learning rules remain fixed.
  limitation_zh: 消除的是逐步人工标注，而不是正确终局答案监督；搜索与奖励学习规则仍由外部固定设计。
  tags: [self-training, process-reward, tree-search]
  reviewed_at: '2026-09-08'
  evidence_url: https://arxiv.org/abs/2406.03816
  evidence_excerpt: they act as value targets for further refining the process reward model and also facilitate the selection of high-quality traces for policy model self-training
  why_included: Unlike generic tree-search inference, this method explicitly feeds searched traces and step values back into both model-training pathways repeatedly.
  rsi_mechanism:
    target: Policy model and process reward model parameters
    feedback: Tree-search estimates of reaching an oracle correct final answer
    update: Train process rewards on inferred step values and policies on selected reasoning traces
    persistence: Updated policy/reward models guide the next search and self-training iteration
- id: sppo
  kind: paper
  name: Self-Play Preference Optimization for Language Model Alignment
  alias: SPPO
  repo_url: https://arxiv.org/abs/2405.00675
  arxiv_id: '2405.00675'
  category: Papers / Models
  improvement_target: Models
  scope: self-training
  published_at: '2024-05-01'
  date_evidence_url: https://arxiv.org/abs/2405.00675
  venue: ICLR 2025
  publication_status: published
  venue_evidence_url: https://github.com/uclaml/SPPO/blob/main/README.md
  venue_evidence_excerpt: SPPO has been accepted by ICLR2025!
  code_url: https://github.com/uclaml/SPPO
  code_status: official
  code_evidence_url: https://arxiv.org/abs/2405.00675
  code_evidence_excerpt: Codes are available at https://github.com/uclaml/SPPO.
  code_note_en: The official repository explicitly provides code and released models; PairRM is an external pretrained preference model, not the policy learning to judge itself.
  code_note_zh: 官方仓库明确提供代码与模型；PairRM 是外部预训练偏好模型，而非策略学习自我评判。
  summary_en: Treats alignment as a constant-sum two-player game and repeatedly updates the policy against its own generated responses using preference probabilities to approach a Nash equilibrium.
  summary_zh: 将对齐视为常和双人博弈，依据偏好概率针对自身生成回答反复更新策略，以逼近 Nash 均衡。
  limitation_en: Experiments use prompts and a pretrained PairRM judge; the equilibrium guarantee concerns the specified preference game, not unbounded capability growth or self-improving evaluation.
  limitation_zh: 实验使用提示数据与预训练 PairRM 评判者；均衡保证针对指定偏好博弈，不代表无限能力增长或评测机制自改进。
  tags: [self-play, preference-optimization, alignment]
  reviewed_at: '2026-09-08'
  evidence_url: https://arxiv.org/abs/2405.00675
  evidence_excerpt: Self-Play Preference Optimization (SPPO), utilizes iterative policy updates to provably approximate the Nash equilibrium
  why_included: Direct repeated policy updates from self-play-generated comparisons, distinguished from self-rewarding methods because the preference judge is externally pretrained.
  rsi_mechanism:
    target: Aligned language-model policy weights
    feedback: Preference probabilities from a pretrained comparison model
    update: Optimize the SPPO objective against current-policy self-play samples
    persistence: Updated policy generates responses and defines the next iterative opponent
- id: opro
  kind: paper
  name: Large Language Models as Optimizers
  alias: OPRO
  repo_url: https://arxiv.org/abs/2309.03409
  arxiv_id: '2309.03409'
  category: Papers / Harness
  improvement_target: Harness
  scope: bounded-optimization
  published_at: '2023-09-07'
  date_evidence_url: https://arxiv.org/abs/2309.03409
  venue: null
  publication_status: preprint
  venue_evidence_url: null
  code_url: https://github.com/google-deepmind/opro
  code_status: official
  code_evidence_url: https://arxiv.org/abs/2309.03409
  code_evidence_excerpt: Code at https://github.com/google-deepmind/opro.
  code_note_en: Official research code, not a supported Google product; no conference venue was verified from its README.
  code_note_zh: 属于官方研究代码，而非 Google 支持的产品；README 未提供本次可核实的会议归属。
  summary_en: Prompts an LLM with previously proposed solutions and their objective values, evaluates new candidates and feeds the scored history back into later optimization, especially for instructions.
  summary_zh: 把先前候选解及其目标值放入提示，评测 LLM 提出的新候选，再把带分数的历史反馈到后续优化，主要应用于指令优化。
  limitation_en: The optimizer model and scoring task remain fixed; iterative prompt search does not itself improve the LLM's weights or rewrite the optimizer.
  limitation_zh: 优化器模型与评分任务保持固定；迭代提示搜索本身不改进 LLM 权重或改写优化器。
  tags: [prompt-optimization, black-box-search, feedback]
  reviewed_at: '2026-09-08'
  evidence_url: https://arxiv.org/abs/2309.03409
  evidence_excerpt: the new solutions are evaluated and added to the prompt for the next optimization step
  why_included: A foundational bounded feedback-to-prompt optimization loop that makes persistence through scored history explicit, not generic one-shot prompting.
  rsi_mechanism:
    target: Instructions/prompts or other candidate solutions
    feedback: Objective values such as downstream task accuracy
    update: LLM proposes new candidates conditioned on scored prior solutions
    persistence: Evaluated solution history is retained in the next optimization prompt
