- id: continual-harness-paper
  kind: paper
  name: 'Continual Harness: Online Adaptation for Self-Improving Foundation Agents'
  alias: Continual Harness
  repo_url: https://arxiv.org/abs/2605.09998
  arxiv_id: '2605.09998'
  category: Papers / Harness
  improvement_target: Harness
  secondary_improvement_target: Models
  scope: experience-learning
  secondary_scope: self-training
  published_at: '2026-05-11'
  date_evidence_url: https://arxiv.org/abs/2605.09998
  venue: null
  publication_status: preprint
  venue_evidence_url: null
  code_url: https://github.com/PrimeIntellect-ai/prime-agent
  code_status: official
  code_evidence_url: https://github.com/PrimeIntellect-ai/prime-agent/blob/main/README.md
  code_evidence_excerpt: The Continual Harness stores supplemental prompts, memories, skill descriptions, and reusable subagent specifications as durable state that Prime Agent can refine through small, evidence-backed updates
  code_note_en: Official associated implementation of the harness component via an explicit README link to this paper. The inspected paper v1 does not establish release of all Pokemon experiments or the teacher-relabeled weight co-learning pipeline; this is not certified full reproduction code.
  code_note_zh: README 明确链接本文，因此属于 Harness 组件的官方关联实现；所读论文 v1 未证明全部 Pokemon 实验或教师重标注权重共学习流水线已发布，不可称为完整复现代码。
  summary_en: Alternates action and refinement of prompts, subagents, skills and memory within a reset-free run. A separate co-learning experiment relabels rollouts with a frontier teacher and updates an open model without resetting the game.
  summary_zh: 在不重置的运行中交替行动与修订提示、子代理、技能和记忆；另一个共学习实验由前沿教师重标注轨迹，并在不重置游戏的情况下更新开放模型。
  limitation_en: Earlier Gemini Plays Pokemon results used human-in-the-loop harness refinement; later automated adaptation and teacher-assisted weight co-learning are distinct settings. Teacher supervision and game-specific evaluation limit autonomy claims.
  limitation_zh: 早期 Gemini Plays Pokemon 结果使用人在环 Harness 修订，后续自动适配与教师辅助权重共学习是不同设置；教师监督与游戏专用评测限制其自主性主张。
  tags: [online-adaptation, reset-free, co-learning]
  reviewed_at: '2026-09-08'
  evidence_url: https://arxiv.org/abs/2605.09998
  evidence_excerpt: the agent alternates between acting and refining its own prompt, sub-agents, skills, and memory, drawing on any past trajectory data
  why_included: Distinct from Prime Agent's system paper, this work explicitly formalizes online within-run refinement and separately tests harness/model co-learning; both mechanisms and their boundaries are documented.
  rsi_mechanism:
    target: Persistent harness artifacts; model weights in a separate co-learning experiment
    feedback: Past game trajectories and progress; frontier-teacher process labels in co-learning
    update: Alternate acting/refining; optionally train the open model on relabeled rollouts
    persistence: Game state is not reset; refined harness artifacts and updated model checkpoints carry forward
rejected_or_unverified:
- item: Self-Rewarding Language Models official code
  decision: no-official-code-link-established
  evidence_url: https://github.com/facebookresearch/RAM/blob/main/projects/README.md
  evidence_excerpt: '**Self-Rewarding LLMs** [[paper]](https://arxiv.org/abs/2401.10020)'
  reason_en: Followed the root RAM README to its current project inventory. Both Self-Rewarding entries link only the paper, unlike other projects with explicit project/code links. Earlier candidate self_rewarding paths returned 404. Preserve not-found; do not substitute lucidrains or another third-party implementation.
  reason_zh: 从 RAM 根 README 跟进当前项目索引，两处 Self-Rewarding 条目都只有论文链接，区别于有明确项目或代码链接的其他条目；此前 self_rewarding 候选路径返回 404。应保留 not-found，不以 lucidrains 等第三方实现替代。
- item: SICA arXiv 2502.13216
  decision: rejected-wrong-identifier
  evidence_url: https://arxiv.org/abs/2502.13216
  reason_en: The ID is an astronomy paper about inferring ex-situ stellar fraction, not SICA. The verified SICA paper is 2504.15228, first posted 2025-04-21.
  reason_zh: 该编号是关于推断外生恒星占比的天文学论文，而非 SICA；核实的 SICA 编号为 2504.15228，首发于 2025-04-21。
- item: SICA ICLR main-conference label
  decision: workshop-only
  evidence_url: https://github.com/MaximeRobeyns/self_improving_coding_agent/blob/master/README.md
  reason_en: The official citation explicitly names the ICLR 2025 Workshop on Scaling Self-Improving Foundation Models. Do not promote it to main-track acceptance.
  reason_zh: 官方引用明确为 ICLR 2025 Workshop on Scaling Self-Improving Foundation Models，不得提升为主会录用。
- item: ACE and SEAL guessed repository owners
  decision: corrected
  evidence_url: https://github.com/ace-agent/ace/blob/main/README.md
  reason_en: ACE is ace-agent/ace, not stanfordnlp/ace. SEAL is Continual-Intelligence/SEAL, not an owner guessed from its first author's name. Matching paper links and authorship citations were read from official READMEs.
  reason_zh: ACE 为 ace-agent/ace，而非 stanfordnlp/ace；SEAL 为 Continual-Intelligence/SEAL，而非根据第一作者姓名猜测的仓库。已读取官方 README 中的匹配论文链接与作者引用。
- item: Prime Agent and Continual Harness conflation
  decision: separate-papers
  evidence_url: https://github.com/PrimeIntellect-ai/prime-agent/blob/main/README.md
  reason_en: Prime Agent is 2608.23552 (2026-08-24); Continual Harness is 2605.09998 (2026-05-11). The repository cites both. Preserve first arXiv dates rather than substituting an earlier product/blog launch date. The latter paper includes a distinct teacher-relabeled weight co-learning experiment, which must not be silently generalized to every Prime Agent deployment.
  reason_zh: Prime Agent 为 2608.23552（2026-08-24），Continual Harness 为 2605.09998（2026-05-11），仓库同时引用两篇。应保留 arXiv 首版日期，而非替换为更早产品或博客发布日期；后者包含独立的教师重标注权重共学习实验，不得泛化到每个 Prime Agent 部署。
