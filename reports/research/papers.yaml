research:
  title: RSI Papers Across Models, Harness, and Artifacts
  reviewed_at: '2026-09-08'
  record_count: 27
  purpose: Paper research inventory, separate from the active GitHub catalog; no repository recency requirement is imposed on papers or their official implementations.
  date_policy: published_at is the first arXiv submission date from citation_date and submission history; for FunSearch it is the publisher's first online publication date, not the later journal issue date.
  title_policy: Titles reproduce canonical arXiv citation metadata, or the original publisher title for FunSearch; short names are separate aliases.
  venue_policy: A venue is populated only when an author-linked official README or publisher explicitly establishes it. Null means not independently established in this review, not that the paper was rejected or remains unpublished.
  code_policy: official means author linkage established by the paper, original project site, or matching official README. not-found means no author-linked implementation was established in the sources reviewed, not proof that no code exists. No third-party implementation is silently substituted.
  evidence_policy: Source excerpts come from retrieved original abstract/HTML or linked official READMEs. Abstracts may reflect the latest version while published_at always denotes v1. Scientific results were not independently reproduced.
  retrieval: web_fetch failed with non-public DNS resolution; read-only urllib retrieval of arXiv, publisher HTML, and raw GitHub READMEs succeeded. No delegates were used. OpenReview API returned 403; no OpenReview verification is claimed for those requests.
  scopes:
    self-modification: The agent or its improvement procedure is itself an editable object used in subsequent improvement.
    self-training: Internally generated data, rewards, or evaluations update retained model parameters across rounds.
    bounded-optimization: A fixed search/evaluation procedure improves prompts, workflows, model variants, or programs; not unrestricted RSI.
    experience-learning: Feedback creates retained linguistic memory or executable skills used in later trials/tasks, without weight training.
    inference-refinement: Repeated within-task output revision; no claim of durable cross-task policy improvement.
