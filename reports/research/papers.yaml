  summary_en: Evolves executable Core War warriors against all prior opponents, turning the retained population into an adaptive self-play objective rather than optimizing against a fixed benchmark alone.
  summary_zh: 针对所有先前对手进化可执行 Core War 战士，将保留种群变成自适应自博弈目标，而非仅针对固定基准优化。
  limitation_en: The LLM and evolution algorithm remain fixed; reported generalization is within Core War, not evidence of practical cybersecurity capability or unconstrained RSI.
  limitation_zh: LLM 与进化算法保持固定；报告的泛化局限于 Core War，不代表实际网络安全能力或无约束 RSI。
