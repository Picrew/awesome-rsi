  published_at: '2026-03-18'
  publication_date_evidence: '2026-03-18 MiniMax M2.7: Early Echoes of Self-Evolution'
  improvement_target: Harness
  scope: self-modification
  blog_section: technical
  status: verified
  summary_en: Reports more than 100 autonomous rounds of failure-trajectory analysis, scaffold-code modification, evaluation, and keep-or-revert selection; retained memory and skills also support its model-development experiments.
  summary_zh: 报告超过 100 轮自主失败轨迹分析、脚手架代码修改、评测及保留或回滚选择；保留的记忆和技能也用于模型开发实验。
  limitation_en: The reported 30% gain is on internal evaluation sets. Researchers still guide model development and make critical decisions; full autonomous weight-level self-evolution is a future aim.
  limitation_zh: 报告的 30% 增益来自内部评测集；模型开发仍由研究者指导并作关键决策，完整自主的权重级自进化仍是未来目标。
  rsi_mechanism:
    target: Agent scaffold, architecture, skills/MCP implementations and memory mechanisms
    feedback: Failure trajectories, internally built evaluation sets and experiment results
    update: Modify scaffold code and compare evaluation outcomes before keeping or reverting changes
    persistence: Retained scaffold edits, skills and memory guide subsequent optimization rounds
  evidence_url: https://www.minimax.io/news/minimax-m27-en
  evidence_excerpt: 'analyze failure trajectories → plan changes → modify scaffold code → run evaluations → compare results → decide to keep or revert changes'
  reviewed_at: '2026-09-08'
  verified_at: '2026-09-08'
  tags: [minimax, self-modification, harness, internal-evaluation]
  why_included: Original model-company report explicitly describes modification of its own scaffold, measured selection and reuse across more than 100 rounds; not merely a model announcement.
- name: 'Automated researchers can reliably mitigate alignment failures'
  repo_url: https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures
  retrieved_url: https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures
  kind: reading
  category: Essential Readings / Primary Research
  publisher: Anthropic
  publisher_type: frontier-model-company
  authors: []
  author_note: Corporate Anthropic research summary; no named author byline visible. Linked technical report has separate authorship not extracted here.
  published_at: '2026-08-28'
  publication_date_evidence: Aug 28, 2026
  improvement_target: Models
  scope: bounded-optimization
  blog_section: automated-alignment-research
  status: verified
  summary_en: Claude searches literature, proposes methods and data, trains target models, and tests them in repeated experiments across ten alignment-failure categories; methods are checked on held-out benchmarks and larger models.
  summary_zh: Claude 针对十类对齐失败循环检索文献、提出方法和数据、训练目标模型并测试，再在留出基准和更大模型上检验所发现的方法。
  limitation_en: This optimizes external student models rather than Claude's own weights. Capability constraints and a monitoring agent exclude invalid methods; benchmark success does not establish general autonomous alignment science.
  limitation_zh: 优化的是外部学生模型而非 Claude 自身权重；能力约束和监控代理排除无效方法，基准成功不代表通用自主对齐科学已经实现。
  rsi_mechanism:
    target: Training methods and weights of target student models with specific alignment failures
    feedback: Percentage of safety gap closed on public benchmarks, plus capability constraints
    update: Repeated literature search, method/data proposal, target-model training and testing
    persistence: Successful methods are retained and tested on withheld benchmarks and larger models
  evidence_url: https://www.anthropic.com/research/automated-researchers-mitigate-alignment-failures
  evidence_excerpt: 'Claude tackled one alignment failure at a time through a loop of searching literature, proposing methods and data, training, and then testing.'
  reviewed_at: '2026-09-08'
  verified_at: '2026-09-08'
  tags: [anthropic, automated-research, alignment, held-out-evaluation]
  why_included: Direct first-party evidence of AI repeatedly improving model-training methods, with withheld evaluation, anti-cheating and capability-preservation constraints.
- name: 'Automated Alignment Researchers: Using large language models to scale scalable oversight'
  repo_url: https://www.anthropic.com/research/automated-alignment-researchers
  retrieved_url: https://www.anthropic.com/research/automated-alignment-researchers
  kind: reading
  category: Essential Readings / Primary Research
  publisher: Anthropic
  publisher_type: frontier-model-company
  authors: []
  author_note: Corporate Anthropic summary of an Anthropic Fellows study; no individual blog byline visible.
  published_at: '2026-04-14'
  publication_date_evidence: Apr 14, 2026
  improvement_target: Models
  scope: bounded-optimization
  blog_section: automated-alignment-research
  status: verified
  summary_en: Nine Claude research agents propose, implement and evaluate weak-to-strong supervision methods, sharing findings and code; performance-gap feedback determines subsequent experiments.
  summary_zh: 九个 Claude 科研代理提出、实现并评测弱到强监督方法，共享发现与代码，并依据性能差距恢复指标安排后续实验。
  limitation_en: Held-out transfer was mixed, and the best method did not significantly improve production-scale Claude Sonnet 4. Researchers disqualified reward hacks; the researcher models were not themselves retrained in this experiment.
  limitation_zh: 留出任务迁移结果不一，最佳方法在生产规模 Claude Sonnet 4 上没有显著增益；研究者剔除了奖励投机，科研代理本身也未在此实验中被重新训练。
  rsi_mechanism:
    target: Weak-to-strong training methods for a stronger student model
    feedback: Remote performance-gap-recovered score for submitted methods
    update: Propose ideas, run training experiments and analyze results to revise the next method
    persistence: Shared forum findings and uploaded code inform later experiments across agents
  evidence_url: https://www.anthropic.com/research/automated-alignment-researchers
  evidence_excerpt: 'It was up to them to propose their own ideas, run their experiments, analyze their results, and share their findings and code with one another in order to work out what to try next.'
  reviewed_at: '2026-09-08'
  verified_at: '2026-09-08'
  tags: [anthropic, weak-to-strong, automated-research, limitations]
  why_included: A direct automated model-improvement research loop with unusually explicit transfer failures and anti-hacking discussion.
- name: 'Constitutional AI: Harmlessness from AI feedback'
  repo_url: https://www.anthropic.com/research/constitutional-ai-harmlessness-from-ai-feedback
  retrieved_url: https://www.anthropic.com/research/constitutional-ai-harmlessness-from-ai-feedback
  kind: reading
  category: Essential Readings / Primary Research
  publisher: Anthropic
  publisher_type: frontier-model-company
  authors: []
