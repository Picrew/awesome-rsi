- name: 'Prime Agent: A self-improving RLM agent'
  repo_url: https://www.primeintellect.ai/blog/prime-agent
  retrieved_url: https://www.primeintellect.ai/blog/prime-agent
  kind: reading
  category: Essential Readings / Primary Research
  publisher: Prime Intellect
  publisher_type: specialist-model-lab
  authors: [Seth Karten, Alex L. Zhang, Kevin Thomas, Sebastian Müller, Prime Intellect Team]
  published_at: '2026-08-05'
  publication_date_evidence: AUG 05TH, 2026
  improvement_target: Harness
  scope: self-modification
  blog_section: technical
  status: verified
  summary_en: Its /refine pipeline reads its own trajectory and changes persistent prompt notes, memory, skills and subagent specifications; recorded triggers/outcomes and rollback history carry improvements into later turns and sessions.
  summary_zh: /refine 管线读取自身轨迹，修改持久提示笔记、记忆、技能和子代理定义；记录触发原因、结果与回滚历史，使改动进入后续轮次和会话。
  limitation_en: The base system prompt remains immutable, and this does not retrain model weights. Its Factorio result is explicitly suspected of reward hacking; use the mechanism, not that score, as evidence.
  limitation_zh: 基础系统提示保持不可变，也不重训模型权重；文中明确怀疑 Factorio 成绩存在奖励投机，应以机制而非该分数作为证据。
  rsi_mechanism:
    target: Mutable continual-harness prompt notes, subagent specs, skills and memory
    feedback: Agent's own tried actions, outcomes, repeated failures and reusable tactics
    update: Plan minimal CRUD edits in background, then apply to disk and rebuild prompt at a turn boundary
    persistence: Harness state survives turns/sessions with prior-refinement rollback history
  evidence_url: https://www.primeintellect.ai/blog/prime-agent
  evidence_excerpt: 'Each refinement records its trigger and the outcome it produced, so improvement is evidence-backed rather than arbitrary.'
  reviewed_at: '2026-09-08'
  verified_at: '2026-09-08'
