  improvement_target: Models
  scope: self-training
  blog_section: foundational
  status: verified
  summary_en: Samples model responses, generates self-critiques and revisions, fine-tunes on the revised responses, then derives AI preferences for a reward model used in reinforcement learning.
  summary_zh: 采样模型回答、生成自我批评和修订，并用修订回答微调；随后利用 AI 偏好训练奖励模型，再进行强化学习。
