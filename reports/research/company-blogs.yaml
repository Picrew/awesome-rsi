  improvement_target: Models
  scope: bounded-optimization
  blog_section: technical
  status: verified
  summary_en: The PostTrainBench section describes an agent independently choosing synthetic data and training strategies, training four base models, evaluating them and adjusting its next experiments during a 12-hour loop.
  summary_zh: PostTrainBench 章节描述代理自主选择合成数据与训练策略、训练四个基础模型、评测并调整后续实验，形成持续 12 小时的闭环。
  limitation_en: This is a task-bounded external-model optimization experiment, not M3 retraining its own weights. The release also mixes product benchmarks and demos, which are not separate RSI evidence.
  limitation_zh: 这是限定任务的外部模型优化实验，不是 M3 重训自身权重；文章其他产品基准和演示不能单独作为 RSI 证据。
  rsi_mechanism:
    target: Four pretrained base models and their post-training recipes
    feedback: Evaluation across AIME2025, BFCL, GPQA Main, GSM8K and HumanEval
    update: Agent chooses data synthesis and training strategy, trains, evaluates and revises next-round plans
    persistence: Training outcomes and revised experiment plans inform later iterations within the 12-hour run
  evidence_url: https://www.minimax.io/blog/minimax-m3
  evidence_excerpt: 'The entire “data synthesis → training → evaluation → iteration” process took place without any human intervention.'
  reviewed_at: '2026-09-08'
  verified_at: '2026-09-08'
  tags: [minimax, posttrainbench, automated-training, bounded]
  why_included: Included only for the documented automated model-training and evaluation loop, not for context length, multimodality or generic coding features.
