  limitation_zh: 人编写的宪法原则和固定分阶段训练配方仍然关键；这是有界自监督基础，不是无限重复自主 RSI 的证据。
  rsi_mechanism:
    target: Assistant model weights and AI-preference reward model
    feedback: Constitution-guided self-critiques and pairwise AI preferences
    update: Fine-tune on revised responses, then train with AI-feedback rewards
    persistence: Revised response dataset, trained preference model and assistant checkpoint
