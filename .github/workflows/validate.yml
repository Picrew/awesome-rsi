name: Validate catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify generated README files
        run: python scripts/render_readme.py --check
      - name: Run offline catalog validation
        run: python scripts/verify_catalog.py --skip-links
      - name: Run tests
        run: python -m unittest discover -s tests -v
