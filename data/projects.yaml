    target: Programs and algorithmic components such as MoE load-balancing losses
    feedback: Executable task fitness and novelty checks
    update: LLM mutations with parent sampling and model-selection bandits
    persistence: Evaluated programs remain in the evolutionary archive
  evidence_url: https://sakana.ai/shinka-evolve/
  evidence_excerpt: Evolving New Algorithms with LLMs
  why_included: First-party experiments demonstrate retained program evolution and AI-training artifact optimization, not
    merely inference-time tool use.
  pushed_at: '2026-08-21T13:07:37Z'
  archived: false
  private: false
