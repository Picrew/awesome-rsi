- name: ShinkaEvolve
  repo_url: https://github.com/SakanaAI/ShinkaEvolve
  category: Artifacts / Program Evolution
  kind: project
  scope: bounded-optimization
  summary_en: Evolves programs with parent sampling, novelty rejection and bandit-based LLM selection; evaluated successors
    re-enter the archive, including experiments on AI training-loss design.
  summary_zh: 结合父代采样、新颖性筛选和 bandit 式 LLM 选择进化程序；评测后的后代重新进入档案，实验也包含 AI 训练损失设计。
  limitation_en: The evaluator and evolutionary machinery are supplied by researchers; generating its own problems is a proposed
    extension, not a demonstrated feature.
  limitation_zh: 评测器与进化机制由研究者提供；自行生成问题是未来扩展，而非已证明的功能。
  tags:
  - program-evolution
  - novelty
  - ai-training
  stars_snapshot: 1375
  updated_at: '2026-08-21'
  reviewed_at: '2026-09-08'
