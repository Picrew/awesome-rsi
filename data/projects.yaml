catalog:
  title_en: Awesome RSI
  title_zh: Awesome RSI
  last_verified: '2026-09-09'
  description_en: 'A curated research map of recursive self-improvement: agents that revise their own machinery, models that
    generate their next training signal, and the evidence that defines their limits.'
  description_zh: 递归自我改进研究地图：修改自身机制的代理、产生下一轮训练信号的模型，以及界定其能力边界的证据。
  scope_en: RSI means an improved system participates in producing subsequent improvements. We prioritize implementations
    that change their own improvement machinery; related self-training and persistent artifact optimization are labeled separately.
    A normal tool-use loop, test runner, RAG framework, or manually maintained skill collection does not qualify. Each entry
    names the object changed, feedback, retained state, and limitation.
  scope_zh: RSI 指改进后的系统参与产生后续改进。优先收录能修改自身改进机制的实现；相关的自训练与持久化产物优化单独标注。普通工具调用循环、测试工具、RAG 框架或人工维护的技能合集不构成收录依据。每条必须明确改进对象、反馈、保留状态与限制。
categories:
- id: models-training-research
  anchor: models--training-research
  group: Models
  name_en: Models / Training Research
  name_zh: Models / 训练研究
  description_en: Agents revise training recipes and evaluate resulting models; the researching agent is not necessarily retrained.
  description_zh: 代理调整训练配方并评测训练结果，不意味着科研代理本身也被重新训练。
- id: models-self-training
  anchor: models--recursive-self-training
  group: Models
  name_en: Models / Recursive Self-Training
  name_zh: Models / 递归自训练
  description_en: Model updates change the agents that generate the next round of training tasks, solutions or rewards.
  description_zh: 模型更新会改变产生下一轮训练任务、解答或奖励的代理。
- id: harness-self-modification
  anchor: harness--self-modification
  group: Harness
  name_en: Harness / Self-Modification
  name_zh: Harness / 自修改
  description_en: The agent implementation and its improvement procedure are themselves editable.
  description_zh: 代理实现及其改进过程本身是可修改对象。
- id: harness-prompt-workflow
  anchor: harness--prompt-and-workflow-optimization
  group: Harness
  name_en: Harness / Prompt and Workflow Optimization
  name_zh: Harness / 提示与工作流优化
  description_en: Feedback updates retained prompts or workflow graphs. These bounded optimizers do not establish unrestricted
    self-modification.
  description_zh: 反馈用于更新并保留提示或工作流图。这类有界优化器不代表无约束的自修改。
- id: artifacts-programs
  anchor: artifacts--program-evolution
  group: Artifacts
  name_en: Artifacts / Program Evolution
  name_zh: Artifacts / 程序进化
  description_en: Executable programs and algorithms are evolved against an evaluator; the optimizer is generally fixed.
  description_zh: 针对评测器进化可执行程序与算法，优化器本身通常保持固定。
- id: artifacts-skills
  anchor: artifacts--learned-skills
  group: Artifacts
  name_en: Artifacts / Learned Skills
  name_zh: Artifacts / 学习所得技能
  description_en: Skills are created and revised from experience for reuse across later tasks, not simply bundled as a static
    library.
  description_zh: 从经验创建并修订技能，供后续任务复用，而非仅打包静态技能库。
- id: readings
  anchor: readings
  group: Readings
  name_en: Essential Readings / Primary Research
  name_zh: 精选阅读 / 一手研究
  description_en: First-party research explaining self-improvement mechanisms and their boundaries.
  description_zh: 解释自改进机制及其边界的一手研究文章。
- id: papers-models
  anchor: papers--models
  group: Papers
  name_en: Papers / Models
  name_zh: 论文 / Models
  description_en: Iterative model, curriculum and evaluator training. Updated models create later training signals; the learning
    rule can remain fixed.
  description_zh: 模型、课程与评判器的迭代训练：更新后的模型参与产生后续训练信号，学习规则本身可以保持固定。
- id: papers-harness
  anchor: papers--harness
  group: Papers
  name_en: Papers / Harness
  name_zh: 论文 / Harness
  description_en: Agents revise their own executable code or retained control procedures, then use the revised system in subsequent
    improvement.
  description_zh: 代理修改自身可执行代码或持久控制过程，并将修改后的系统用于后续改进。
- id: papers-theory-evaluation
  anchor: papers--theory-and-evaluation
  group: Papers
  name_en: Papers / Theory and Evaluation
  name_zh: 论文 / 理论与评测
  description_en: Formal foundations, proposed closed-loop learning, and tests of whether self-improvement signals remain
    reliable. These are not implementation demonstrations.
  description_zh: 形式化基础、闭环学习设想，以及自改进信号可靠性的评测。这些条目不作为实现类实证展示。
entries:
- name: RD-Agent / FT-Agent
  repo_url: https://github.com/microsoft/RD-Agent
  category: Models / Training Research
  kind: project
  scope: bounded-optimization
  summary_en: FT-Agent generates data-processing code and training configurations, fine-tunes a target LLM, then uses OpenCompass
    validation feedback to refine the next training experiment.
  summary_zh: FT-Agent 生成数据处理代码和训练配置、微调目标 LLM，再利用 OpenCompass 验证反馈调整下一轮训练实验。
  limitation_en: This improves an external target model, not the planner's own weights; test splits are reserved for final
    reporting.
  limitation_zh: 改进的是外部目标模型，不是规划代理自身权重；测试集保留用于最终报告。
  tags:
  - model-training
  - experiment-loop
  - validation
  stars_snapshot: 14553
  updated_at: '2026-09-04'
  reviewed_at: '2026-09-08'
  rsi_mechanism:
    target: Target LLM weights and training recipe
    feedback: OpenCompass validation results, separate from held-out test reporting
    update: Revise processing code and training configuration, then fine-tune again
    persistence: Experiment traces and feedback inform subsequent loop iterations
  evidence_url: https://github.com/microsoft/RD-Agent/blob/main/rdagent/app/finetune/llm/README.md
  evidence_excerpt: evaluate with OpenCompass and use feedback for the next iteration
  why_included: Included only for the documented FT-Agent training loop, not the repository's generic research tooling or
    financial-agent use cases.
  pushed_at: '2026-09-04T02:25:50Z'
  archived: false
  private: false
  license: MIT
  metadata_checked_at: '2026-09-09'
  metadata_source: https://api.github.com/repos/microsoft/RD-Agent
- name: HyperAgents
  repo_url: https://github.com/facebookresearch/HyperAgents
  category: Harness / Self-Modification
  kind: project
  scope: self-modification
  summary_en: Integrates task and meta agents in one editable program; evaluated descendants can change both task behavior
    and the procedure that generates subsequent agents.
  summary_zh: 将任务代理与元代理整合为可编辑程序；经过评测的后代既能修改任务行为，也能修改生成后续代理的过程。
  limitation_en: Empirical task-bounded experiments, not proof of indefinite improvement or foundation-model weight self-training.
  limitation_zh: 属于限定任务的实证实验，不是无限改进证明，也不是基础模型权重自训练。
  tags:
  - self-modification
  - meta-agent
  - archive
  stars_snapshot: 2719
  updated_at: '2026-07-31'
  reviewed_at: '2026-09-08'
  rsi_mechanism:
    target: Task-agent code and meta-agent improvement procedure
    feedback: Downstream task and meta-evaluation results
    update: Apply lineage patches and edit both task and agent-generation mechanisms
    persistence: model_patch.diff and archive.jsonl retain evaluated descendants for later generations
  evidence_url: https://github.com/facebookresearch/HyperAgents/blob/main/utils/gl_utils.py
  evidence_excerpt: edit and enhance its own mechanisms for generating agents
  why_included: Unlike an external optimizer with fixed mutation logic, the meta-level modification procedure is itself editable.
  pushed_at: '2026-07-31T16:56:22Z'
  archived: false
  private: false
  license: NOASSERTION
  metadata_checked_at: '2026-09-09'
  metadata_source: https://api.github.com/repos/facebookresearch/HyperAgents
- name: DSPy / GEPA and MIPROv2
  repo_url: https://github.com/stanfordnlp/dspy
  category: Harness / Prompt and Workflow Optimization
  kind: project
  scope: bounded-optimization
  summary_en: Compiles LM programs by optimizing instructions and demonstrations against task metrics; compiled programs retain
    the selected configuration for later use.
  summary_zh: 针对任务指标优化指令和示例来编译 LM 程序，编译结果保留所选配置供后续使用。
  limitation_en: Included for its optimizers, not all DSPy functionality; prompt compilation does not by itself modify the
    optimizer or model weights.
  limitation_zh: 仅因其优化器收录，而非 DSPy 的所有功能；提示编译本身不修改优化器或模型权重。
  tags:
  - prompt-optimization
  - demonstrations
  - metrics
  stars_snapshot: 37865
  updated_at: '2026-09-05'
  reviewed_at: '2026-09-08'
  rsi_mechanism:
    target: LM program instructions and demonstrations
    feedback: User-defined task metric over training and validation examples
    update: Search and select program configurations with GEPA or MIPROv2
    persistence: Compiled program configuration is reused at inference
  evidence_url: https://github.com/stanfordnlp/dspy/blob/main/dspy/teleprompt/gepa/gepa.py
  evidence_excerpt: GEPA uses the trainset to perform reflective updates to the prompt, but uses the valset for tracking Pareto
    scores.
  why_included: Automatic metric-driven program compilation is a bounded harness-improvement component; general LM orchestration
    is not the inclusion rationale.
  pushed_at: '2026-09-05T20:02:14Z'
  archived: false
  private: false
  license: MIT
  metadata_checked_at: '2026-09-09'
  metadata_source: https://api.github.com/repos/stanfordnlp/dspy
- name: GEPA
  repo_url: https://github.com/gepa-ai/gepa
  category: Harness / Prompt and Workflow Optimization
  kind: project
  scope: bounded-optimization
  summary_en: Reflects on execution traces and evaluator feedback to propose prompt revisions, retaining complementary candidates
    through Pareto-based selection.
  summary_zh: 反思执行轨迹和评测反馈来提出提示修订，并通过 Pareto 选择保留互补候选。
  limitation_en: The original method optimizes prompts with fixed model weights; its general optimize_anything API is not
    evidence that GEPA rewrites itself.
  limitation_zh: 原始方法在固定模型权重下优化提示；通用 optimize_anything API 不代表 GEPA 会改写自身。
  tags:
  - reflection
  - pareto-selection
  - prompt-optimization
  stars_snapshot: 6485
  updated_at: '2026-09-08'
  reviewed_at: '2026-09-08'
  rsi_mechanism:
    target: Prompt instructions in the original GEPA method
    feedback: Rich execution traces, natural-language feedback and task scores
    update: Reflective mutation with Pareto candidate selection
    persistence: Candidate population and best prompt configuration feed later rounds
  evidence_url: https://github.com/gepa-ai/gepa
  evidence_excerpt: Through iterative reflection, mutation, and Pareto-aware selection, GEPA evolves high-performing variants
    with minimal evaluations.
  why_included: Explicit feedback-driven prompt evolution; distinguished from DSPy's integration of this optimizer and from
    unrestricted RSI.
  pushed_at: '2026-09-08T02:23:23Z'
  archived: false
  private: false
  license: MIT
  metadata_checked_at: '2026-09-09'
  metadata_source: https://api.github.com/repos/gepa-ai/gepa
- name: EvoAgentX / Evolution Algorithms
  repo_url: https://github.com/ANative-Lab/EvoAgentX
