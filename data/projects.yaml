- name: 'ShinkaEvolve: Evolving New Algorithms with LLMs, Orders of Magnitude More Efficiently'
  repo_url: https://sakana.ai/shinka-evolve/
  category: Essential Readings / Primary Research
  kind: reading
  scope: bounded-optimization
  publisher: Sakana AI
  published_at: '2025-09-25'
  improvement_target: Artifacts
  featured_order: 3
  summary_en: Details sample-efficient program evolution and an evolved MoE load-balancing loss, tying executable candidate
    selection to subsequent program generations.
  summary_zh: 详述高样本效率的程序进化与进化所得 MoE 负载均衡损失，将可执行候选的选择结果用于后续程序代。
