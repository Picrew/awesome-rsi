- name: OpenEvolve
  repo_url: https://github.com/algorithmicsuperintelligence/openevolve
  category: Artifacts / Program Evolution
  kind: project
  scope: bounded-optimization
  summary_en: Evolves executable program variants using LLM mutations, task-specific evaluators and an archive that seeds
    subsequent generations.
  summary_zh: 利用 LLM 变异、任务专用评测器和候选档案进化可执行程序，档案中的程序继续成为后续代的起点。
  limitation_en: Programs are the improvement target; neither a self-rewriting optimizer nor recursive proposer-weight training
    is established.
  limitation_zh: 改进对象是程序，并未证明优化器会改写自身或递归训练提案模型权重。
  tags:
  - program-evolution
  - evaluator
  - archive
  stars_snapshot: 7338
  updated_at: '2026-07-18'
  reviewed_at: '2026-09-08'
  rsi_mechanism:
    target: Executable candidate programs
    feedback: User-supplied executable evaluator metrics
    update: LLM-generated program mutations selected by fitness and diversity
    persistence: Program database supplies parent and inspiration programs for later generations
  evidence_url: https://github.com/algorithmicsuperintelligence/openevolve
  evidence_excerpt: 'Artifact Side-Channel: Error feedback improves subsequent generations'
  why_included: A concrete archive-to-mutation-to-evaluation program-improvement loop, classified by its changed artifact
    rather than by its orchestration tooling.
  pushed_at: '2026-07-18T13:16:12Z'
  archived: false
  private: false
  license: Apache-2.0
  metadata_checked_at: '2026-09-09'
